<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCOUT Command Center — Login</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --danger: #e55353;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 360px;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    p { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input[type="password"] {
      width: 100%;
      background: #0f1419;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.65rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 0.6rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2rem; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SCOUT Command Center</h1>
    <p>Operator login required</p>
    <form id="login-form">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">LOGIN</button>
    </form>
    <div class="error" id="error"></div>
  </div>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = document.getElementById("password").value;
      var err = document.getElementById("error");
      err.textContent = "";
      fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ password: pw })
      }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.detail || "Login failed");
          window.location.href = "/command-center";
        });
      }).catch(function (ex) {
        err.textContent = ex.message || "Login failed";
      });
    });
  </script>
</body>
</html>
