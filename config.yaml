# Scout Auto OS — Alpha Execution
paper_mode: true          # true=paper | false=real Binance Futures
mode: paper
initial_capital: 10000.0

execution:
  order_size_usdt: 5
  max_retries: 3
  retry_delay_sec: 2
  leverage: 1

long_engine:
  enabled: true
  search_formula: A6_frozen
  entry: immediate_100pct
  exit: dynamic_efr_state
  universe_tier: top5
  max_candidates_alert: 5

short_engine:
  enabled: false
  shadow_mode: true

position:
  max_long_slots: 3
  max_short_slots: 3
  max_total_slots: 6
  capital_exposure: 1.0
  meta_rotation: false
  split_entry: false

portfolio_engine:
  enabled: false
  max_long_slots: 3
  max_short_slots: 3
  replacement_margin_pct: 8.0
  hold_hours: 2
  scan_interval_hours: 2
  universe_max_symbols: 120

risk:
  daily_loss_limit_pct: -10.0
  max_single_trade_loss_pct: -12.0
  kill_switch: false

loop:
  scan_interval_sec: 300
  position_update_sec: 30
  daily_report_hour_kst: 23

research:
  enabled: false
  scan_interval_min: 5
  top_n: 20
  workers: 8
  forward_tick_sec: 60

entry_quality:
  min_24h_quote_volume_usdt: 10000000
  min_1h_quote_volume_usdt: 400000
  min_5m_quote_volume_ratio: 1.5
  max_pullback_from_15m_high_pct: 2.5
  block_last_5m_red_candle: true
  max_estimated_slippage_pct: 0.3
  block_negative_ev: true
  summary_interval_sec: 1800

risk_guard:
  max_position_roi_loss_pct: -18
  max_position_unrealized_loss_usdt: -0.60
  max_hold_minutes_with_negative_pnl: 45

state_engine:
  review_interval_sec: 1800
  hold_target_minutes: 120
  min_hold_before_exit_min: 30
  hold_alive_score: 70
  exit_alive_score: 45
  alive_delta_exit: -25
  protective_sl_pct: 10

position_evaluation:
  enabled: true
  min_review_interval_sec: 60
  review_interval_minutes: 5
  override_state_exit: true

expectation:
  enabled: true

alerts:
  console: true
  csv: true
  telegram: false
  discord: false

data:
  adapter: auto  # auto | mock | live | cache
  kline_cache_dir: logs/phase19_winner_dna/kline_cache

live_data:
  enabled: true
  ws_base: wss://fstream.binance.com
  rest_base: https://fapi.binance.com
  interval: 5m
  bootstrap_limit: 100
  reconnect_sec: 5
  heartbeat_timeout_sec: 60
  log_dir: logs/live

runtime_audit:
  enabled: true
  track_duplicates: true
  ablation_lookback_scans: 55

value_gate_shadow:
  enabled: true
  labeler:
    false_skip_roi_2h_pct: 10.0
    false_skip_peak_roi_pct: 15.0
    false_accept_drawdown_pct: -10.0
    win_threshold_pct: 3.0
    kline_interval: 15m

guardian:
  progress:
    weights:
      roi_progress: 0.30
      time_alignment: 0.15
      drawdown_health: 0.20
      value_score: 0.20
      win_probability: 0.15

portfolio_decision:
  replacement_margin: 5.0
  min_candidate_score: 40.0
  position_weights:
    guardian_score: 0.30
    expected_roi: 0.20
    current_roi: 0.20
    remaining_opportunity: 0.15
    confidence: 0.15
  candidate_weights:
    value_score: 0.35
    expected_roi: 0.25
    win_prob: 0.20
    confidence: 0.20

storage:
  sqlite_path: scout_auto_os/data/scout_auto_os.db
  csv_dir: logs/auto_os

dashboard:
  host: localhost
  port: 8501
